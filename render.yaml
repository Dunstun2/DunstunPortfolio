# Render Blueprint for Portfolio Backend
# 
# This file defines the infrastructure for deploying to Render.com
# Upload this file or connect your GitHub repo to Render
#
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: portfolio-backend
    env: node
    region: oregon
    plan: free # Change to 'starter' or higher for production
    buildCommand: cd backend && npm install && npx sequelize-cli db:migrate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true # Render auto-generates secure value
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # Set manually in Render dashboard
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: portfolio-db
    databaseName: portfolio_production
    plan: free # Change to 'starter' or higher for production
    region: oregon
    postgresMajorVersion: 15
